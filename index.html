document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

0.5deg); } }\n  @keyframes typingDot { 0%,60%,100% { transform:translateY(0); opacity:0.4; } 30% { transform:translateY(-4px); opacity:1; } }\n  @keyframes heroIn { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:translateY(0); } }\n  @media (prefers-reduced-motion: reduce) {\n    *, *::before, *::after { animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important; }\n  }\n  @media (max-width:899px) {\n    [data-nav-links] { display:none !important; }\n    [data-nav-toggle] { display:inline-flex !important; }\n    [data-hero-grid] { grid-template-columns:1fr !important; }\n  }\n  @media (min-width:900px) {\n    [data-nav-toggle] { display:none !important; }\n  }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"font-family:'Atkinson Hyperlegible', system-ui, sans-serif; background:var(--cream); color:var(--text); min-height:100vh; overflow-x:hidden; font-size:1.0625rem; line-height:1.55;\">\n<main>\n\n  <!-- NAV -->\n  <nav aria-label=\"Primary\" style=\"{{ navStyle }}\">\n    <div style=\"display:flex; align-items:center; justify-content:space-between; max-width:1200px; margin:0 auto; padding:20px 32px; gap:24px; flex-wrap:wrap;\">\n      <div style=\"font-family:'Fraunces',serif; font-size:1.5rem; letter-spacing:-0.01em;\"><span style=\"color:var(--green);\">p<\u002Fspan>laddra<\u002Fdiv>\n      <div data-nav-links=\"\" style=\"display:flex; align-items:center; gap:28px; flex-wrap:wrap;\">\n        <a href=\"#how\" style=\"color:var(--text); text-decoration:none; font-size:0.875rem; font-weight:700;\">How it works<\u002Fa>\n        <a href=\"#kidsafe\" style=\"color:var(--text); text-decoration:none; font-size:0.875rem; font-weight:700;\">Kid safe<\u002Fa>\n        <a href=\"#privacy\" style=\"color:var(--text); text-decoration:none; font-size:0.875rem; font-weight:700;\">Privacy<\u002Fa>\n        <a href=\"#faq\" style=\"color:var(--text); text-decoration:none; font-size:0.875rem; font-weight:700;\">FAQ<\u002Fa>\n        <a href=\"#get-started\" style=\"background:var(--ink); color:var(--cream); text-decoration:none; font-size:0.875rem; font-weight:700; padding:13px 22px; min-height:44px; display:inline-flex; align-items:center; border-radius:var(--r-pill);\" style-hover=\"background:var(--green-deep);\">Set up your child<\u002Fa>\n      <\u002Fdiv>\n      <button data-nav-toggle=\"\" sc-camel-on-click=\"{{ toggleMobileNav }}\" aria-expanded=\"{{ mobileNavOpen }}\" aria-label=\"Menu\" style=\"display:none; align-items:center; justify-content:center; width:44px; height:44px; border:1px solid var(--line); background:var(--white); border-radius:var(--r-sm); font-size:1.25rem; cursor:pointer;\">☰<\u002Fbutton>\n    <\u002Fdiv>\n    <sc-if value=\"{{ mobileNavOpen }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display:flex; flex-direction:column; gap:2px; padding:0 32px 20px; background:var(--cream);\">\n        <a href=\"#how\" style=\"color:var(--text); text-decoration:none; font-size:1rem; font-weight:700; padding:12px 0; border-top:1px solid var(--line);\">How it works<\u002Fa>\n        <a href=\"#kidsafe\" style=\"color:var(--text); text-decoration:none; font-size:1rem; font-weight:700; padding:12px 0; border-top:1px solid var(--line);\">Kid safe<\u002Fa>\n        <a href=\"#privacy\" style=\"color:var(--text); text-decoration:none; font-size:1rem; font-weight:700; padding:12px 0; border-top:1px solid var(--line);\">Privacy<\u002Fa>\n        <a href=\"#faq\" style=\"color:var(--text); text-decoration:none; font-size:1rem; font-weight:700; padding:12px 0; border-top:1px solid var(--line); border-bottom:1px solid var(--line);\">FAQ<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fnav>\n\n  <!-- HERO -->\n  <div style=\"max-width:1200px; margin:0 auto; padding:64px 32px 48px; position:relative;\">\n    <div style=\"position:absolute; top:-40px; right:-60px; width:420px; height:420px; background:radial-gradient(circle, rgba(90,155,132,0.16) 0%, rgba(90,155,132,0) 70%); border-radius:50%; pointer-events:none; z-index:0;\"><\u002Fdiv>\n    <div data-hero-grid=\"\" style=\"display:grid; grid-template-columns:1.1fr 0.9fr; gap:40px; align-items:center; position:relative; z-index:1;\">\n      <div style=\"animation:heroIn 0.6s ease both;\">\n        <div style=\"font-size:1rem; font-weight:700; color:var(--text-muted); margin-bottom:10px;\">AI built right. For kids. For families. For school.<\u002Fdiv>\n        <h1 style=\"font-size:clamp(2.25rem, 5vw, 3.25rem); line-height:1.1; margin:0 0 20px; letter-spacing:-0.01em; color:var(--text);\">A tutor that <em style=\"font-style:italic; color:var(--clay-deep);\">asks<\u002Fem> before it answers.<\u002Fh1>\n        <p style=\"font-size:1.0625rem; line-height:1.55; color:var(--text-soft); max-width:480px; margin:0 0 28px;\">Every child gets help at their level. Not quick answers, help to think further. Free for families, hosted in the EU.<\u002Fp>\n        <div style=\"display:flex; align-items:center; gap:16px; flex-wrap:wrap; margin-bottom:16px;\">\n          <a href=\"#get-started\" style=\"background:var(--ink); color:var(--cream); text-decoration:none; font-size:1rem; font-weight:700; padding:15px 28px; min-height:44px; display:inline-flex; align-items:center; border-radius:var(--r-pill);\" style-hover=\"background:var(--green-deep);\">Set up your child<\u002Fa>\n          <a href=\"#for-schools\" style=\"color:var(--text); text-decoration:none; font-size:1rem; font-weight:700; padding:15px 4px; border-bottom:2px solid var(--ink); min-height:44px; display:inline-flex; align-items:center;\">For schools<\u002Fa>\n        <\u002Fdiv>\n        <div style=\"display:inline-block; font-size:1rem; font-weight:700; color:var(--text-soft); background:var(--sand); padding:8px 16px; border-radius:var(--r-pill); margin-bottom:14px;\"><span style=\"color:var(--green);\">p<\u002Fspan>rivate. <span style=\"color:var(--green);\">p<\u002Fspan>edagogical. <span style=\"color:var(--green);\">p<\u002Fspan>ersonal.<\u002Fdiv>\n        <div style=\"font-size:0.875rem; color:var(--text-muted);\">Ten minutes to set up. No card. Delete anytime.<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:flex; flex-direction:column; gap:16px; max-width:340px;\">\n        <div style=\"background:var(--green); border-radius:var(--r-lg); box-shadow:var(--shadow-lg); animation:float1 7s ease-in-out infinite; padding:20px; display:flex; flex-direction:column; gap:10px;\">\n          <div style=\"font-size:0.875rem; font-weight:700; letter-spacing:0.06em; text-transform:uppercase; color:var(--green-pale);\">Grade 8 · Chemistry<\u002Fdiv>\n          <div style=\"display:flex; gap:8px; align-items:flex-start;\">\n            <div style=\"width:24px; height:24px; border-radius:50%; background:var(--cream); color:var(--green-deep); font-family:'Fraunces',serif; font-size:0.875rem; font-weight:700; display:flex; align-items:center; justify-content:center; flex-shrink:0;\">p<\u002Fdiv>\n            <div style=\"color:var(--cream); font-size:1rem; line-height:1.5;\">What happens when a leaf gets sunlight?<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"align-self:flex-end; max-width:80%; background:var(--cream); color:var(--text); font-size:1rem; line-height:1.4; padding:10px 14px; border-radius:14px 14px 4px 14px;\">It makes energy?<\u002Fdiv>\n          <div style=\"display:flex; gap:8px; align-items:flex-start;\">\n            <div style=\"width:24px; height:24px; border-radius:50%; background:var(--cream); color:var(--green-deep); font-family:'Fraunces',serif; font-size:0.875rem; font-weight:700; display:flex; align-items:center; justify-content:center; flex-shrink:0;\">p<\u002Fdiv>\n            <div style=\"color:var(--cream); font-size:1rem; line-height:1.5;\">Exactly. That's photosynthesis. Let's look at the chemistry.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"align-self:flex-start; display:flex; gap:4px; padding:2px 0 4px 32px;\">\n            <div style=\"width:6px; height:6px; border-radius:50%; background:rgba(250,248,244,0.6); animation:typingDot 1.2s ease-in-out infinite;\"><\u002Fdiv>\n            <div style=\"width:6px; height:6px; border-radius:50%; background:rgba(250,248,244,0.6); animation:typingDot 1.2s ease-in-out infinite 0.2s;\"><\u002Fdiv>\n            <div style=\"width:6px; height:6px; border-radius:50%; background:rgba(250,248,244,0.6); animation:typingDot 1.2s ease-in-out infinite 0.4s;\"><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:var(--white); border:1px solid var(--line); border-radius:var(--r-lg); box-shadow:var(--shadow-sm); animation:float2 8s ease-in-out infinite 0.4s; padding:20px; display:flex; flex-direction:column; gap:8px;\">\n          <div style=\"font-size:0.875rem; font-weight:700; letter-spacing:0.06em; text-transform:uppercase; color:var(--text-muted);\">Understanding<\u002Fdiv>\n          <div style=\"font-family:'Fraunces',serif; font-size:1.125rem; color:var(--text);\">Photosynthesis<\u002Fdiv>\n          <div style=\"height:8px; width:100%; background:var(--line); border-radius:6px; margin-top:4px; overflow:hidden;\">\n            <div style=\"height:100%; width:70%; background:var(--clay); border-radius:6px;\"><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-size:0.875rem; color:var(--text-muted);\">3 of 4 concepts started<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n    <!-- TRUST BAR -->\n  <div style=\"background:var(--sand); padding:32px 0;\"><div style=\"max-width:1200px; margin:0 auto; padding:0 32px; display:flex; gap:12px; flex-wrap:wrap; justify-content:center;\">\n    <sc-for list=\"{{ trustItems }}\" as=\"item\" hint-placeholder-count=\"6\">\n      <div style=\"font-size:0.875rem; font-weight:700; color:var(--green-deep); background:var(--white); padding:10px 16px; border-radius:var(--r-pill);\">{{ item }}<\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv><\u002Fdiv>\n\n    <!-- WHAT PLADDRA IS -->\n  <div style=\"max-width:1200px; margin:0 auto; padding:48px 32px;\">\n    <h2 style=\"font-size:clamp(1.75rem, 3.5vw, 2.5rem); margin:0 0 40px; letter-spacing:-0.01em;\">One tool. Home and school.<\u002Fh2>\n    <div style=\"display:grid; grid-template-columns:repeat(auto-fit, minmax(260px, 1fr)); gap:var(--s-3);\">\n      <div style=\"grid-column:1 / -1; background:var(--green); color:var(--cream); border-radius:var(--r-lg); padding:36px; display:grid; gap:24px; grid-template-columns:repeat(auto-fit, minmax(220px,1fr)); align-items:center;\">\n        <div>\n          <div style=\"font-family:'Fraunces',serif; font-size:1.5rem; margin-bottom:10px;\">Every child is unique, curious, and creative.<\u002Fdiv>\n          <div style=\"font-size:1rem; color:var(--green-pale); line-height:1.5;\">Pladdra works to unlock the hidden and emerging development of every child.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <sc-for list=\"{{ whatCardsSmall }}\" as=\"card\" hint-placeholder-count=\"4\">\n        <div style=\"background:var(--white); border-radius:var(--r-md); padding:28px; display:flex; flex-direction:column; gap:8px; box-shadow:var(--shadow-sm);\">\n          <div style=\"font-size:0.875rem; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; color:var(--clay-deep);\">{{ card.tag }}<\u002Fdiv>\n          <div style=\"font-family:'Fraunces',serif; font-size:1.25rem;\">{{ card.title }}<\u002Fdiv>\n          <div style=\"font-size:1rem; line-height:1.5; color:var(--text-soft);\">{{ card.body }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n    <!-- HOW IT WORKS: TABS -->\n  <div style=\"background:var(--sand);\"><div id=\"how\" style=\"max-width:1200px; margin:0 auto; padding:48px 32px;\">\n    <h2 id=\"for-schools\" style=\"font-size:clamp(1.75rem, 3.5vw, 2.5rem); margin:0 0 32px; letter-spacing:-0.01em;\">How it works.<\u002Fh2>\n    <div role=\"tablist\" aria-label=\"How it works\" sc-camel-on-key-down=\"{{ onTabKeyDown }}\" style=\"display:flex; gap:8px; flex-wrap:wrap; margin-bottom:24px;\">\n      <sc-for list=\"{{ tabDefs }}\" as=\"tab\" hint-placeholder-count=\"3\">\n        <button role=\"tab\" aria-selected=\"{{ tab.selected }}\" tabindex=\"{{ tab.tabIndex }}\" sc-camel-on-click=\"{{ tab.select }}\" style=\"{{ tab.style }}\">{{ tab.label }}<\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <sc-if value=\"{{ isHomeTab }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"display:grid; grid-template-columns:repeat(auto-fit, minmax(260px,1fr)); gap:32px;\">\n        <div>\n          <sc-for list=\"{{ homeSteps }}\" as=\"step\" hint-placeholder-count=\"3\">\n            <div style=\"display:flex; gap:16px; margin-bottom:22px;\">\n              <div style=\"width:36px; height:36px; border-radius:50%; background:var(--clay-tint); color:var(--clay-deep); display:flex; align-items:center; justify-content:center; font-family:'Fraunces',serif; font-size:1rem; flex-shrink:0;\">{{ step.n }}<\u002Fdiv>\n              <div>\n                <div style=\"font-size:1.0625rem; font-weight:700; margin-bottom:4px;\">{{ step.title }}<\u002Fdiv>\n                <div style=\"font-size:1rem; color:var(--text-soft);\">{{ step.body }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n          <a href=\"#get-started\" style=\"display:inline-flex; align-items:center; min-height:44px; background:var(--ink); color:var(--cream); text-decoration:none; font-size:1rem; font-weight:700; padding:15px 28px; border-radius:var(--r-pill); margin-top:8px;\" style-hover=\"background:var(--green-deep);\">Set up your child<\u002Fa>\n          <div style=\"font-size:0.875rem; color:var(--text-muted); margin-top:12px;\">Ten minutes to set up. No card. Delete anytime.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:grid; grid-template-columns:repeat(auto-fit, minmax(200px,1fr)); gap:12px; align-content:start;\">\n          <sc-for list=\"{{ homeBullets }}\" as=\"b\" hint-placeholder-count=\"6\">\n            <div style=\"background:var(--white); border-radius:var(--r-sm); padding:18px; box-shadow:var(--shadow-sm); font-size:1rem; font-weight:700;\">{{ b.strong }}<\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isSchoolTab }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display:grid; grid-template-columns:repeat(auto-fit, minmax(260px,1fr)); gap:32px;\">\n        <div>\n          <sc-for list=\"{{ schoolSteps }}\" as=\"step\" hint-placeholder-count=\"3\">\n            <div style=\"display:flex; gap:16px; margin-bottom:22px;\">\n              <div style=\"width:36px; height:36px; border-radius:50%; background:var(--clay-tint); color:var(--clay-deep); display:flex; align-items:center; justify-content:center; font-family:'Fraunces',serif; font-size:1rem; flex-shrink:0;\">{{ step.n }}<\u002Fdiv>\n              <div>\n                <div style=\"font-size:1.0625rem; font-weight:700; margin-bottom:4px;\">{{ step.title }}<\u002Fdiv>\n                <div style=\"font-size:1rem; color:var(--text-soft);\">{{ step.body }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n          <a href=\"#\" style=\"color:var(--text); text-decoration:none; font-size:1rem; font-weight:700; border-bottom:2px solid var(--ink); display:inline-flex; align-items:center; min-height:44px;\">Are you a school? Talk to us<\u002Fa>\n        <\u002Fdiv>\n        <div style=\"display:grid; grid-template-columns:repeat(auto-fit, minmax(200px,1fr)); gap:10px; align-content:start;\">\n          <sc-for list=\"{{ teacherBullets }}\" as=\"b\" hint-placeholder-count=\"6\">\n            <div style=\"padding:14px 0; border-top:1px solid var(--line); font-size:1rem;\">{{ b.strong }}<\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isChildTab }}\" hint-placeholder-val=\"{{ false }}\">\n      <div>\n        <p style=\"font-size:1.0625rem; color:var(--text-soft); max-width:640px; margin:0 0 24px;\">Your child is told, in plain words, exactly who can see what they write.<\u002Fp>\n        <div style=\"display:grid; grid-template-columns:repeat(auto-fit, minmax(240px,1fr)); gap:14px;\">\n          <sc-for list=\"{{ childBullets }}\" as=\"b\" hint-placeholder-count=\"6\">\n            <div style=\"background:var(--white); border-radius:var(--r-sm); padding:18px; box-shadow:var(--shadow-sm); font-size:1rem; font-weight:700;\">{{ b.strong }}<\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv><\u002Fdiv>\n\n    <!-- SEE IT WORKING -->\n  <div style=\"max-width:1000px; margin:0 auto; padding:48px 32px;\">\n    <h2 style=\"font-size:clamp(1.75rem, 3.5vw, 2.5rem); margin:0 0 32px; letter-spacing:-0.01em;\">See it working.<\u002Fh2>\n    <div style=\"display:flex; flex-direction:column; gap:14px; margin-bottom:24px;\">\n      <sc-for list=\"{{ transcript }}\" as=\"turn\" hint-placeholder-count=\"6\">\n        <div style=\"{{ turn.rowStyle }}\">\n          <div style=\"{{ turn.bubbleStyle }}\">\n            <div style=\"font-size:0.875rem; font-weight:700; margin-bottom:4px; color:{{ turn.labelColor }};\">{{ turn.who }}<\u002Fdiv>\n            <div style=\"font-size:1.0625rem; line-height:1.5;\">{{ turn.text }}<\u002Fdiv>\n          <\u002Fdiv>\n          <sc-if value=\"{{ turn.note }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"font-size:0.875rem; font-weight:700; color:var(--clay-deep); margin-top:6px;\">{{ turn.note }}<\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <div style=\"font-size:0.875rem; color:var(--text-muted);\">Every one of these turns is visible to the assigned teacher, and your child is told so.<\u002Fdiv>\n  <\u002Fdiv>\n\n    <!-- KID SAFE -->\n  <div id=\"kidsafe\" style=\"background:var(--sand);\">\n    <div style=\"max-width:1200px; margin:0 auto; padding:48px 32px;\">\n      <h2 style=\"font-size:clamp(1.75rem, 3.5vw, 2.5rem); margin:0 0 32px; letter-spacing:-0.01em;\">Kid safe.<\u002Fh2>\n      <div style=\"display:grid; grid-template-columns:repeat(auto-fit, minmax(260px, 1fr)); gap:14px;\">\n        <sc-for list=\"{{ kidSafeBulletsFull }}\" as=\"b\" hint-placeholder-count=\"7\">\n          <div style=\"background:var(--cream); border-radius:var(--r-md); padding:22px; display:flex; align-items:center; gap:14px;\">\n            <svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 20 20\" fill=\"none\" style=\"flex-shrink:0;\"><circle cx=\"10\" cy=\"10\" r=\"9\" stroke=\"var(--green-deep)\" stroke-width=\"1.4\"><\u002Fcircle><path d=\"M6 10.2l2.6 2.6L14 7.4\" stroke=\"var(--green-deep)\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n            <div style=\"font-size:1rem; font-weight:700;\">{{ b.strong }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n    <!-- PRIVACY & GDPR -->\n  <div style=\"background:var(--sand);\"><div id=\"privacy\" style=\"max-width:1200px; margin:0 auto; padding:48px 32px;\">\n    <div style=\"display:grid; grid-template-columns:repeat(auto-fit, minmax(260px,1fr)); gap:32px;\">\n      <div>\n        <h2 style=\"font-size:clamp(1.75rem, 3.5vw, 2.5rem); margin:0 0 16px; letter-spacing:-0.01em;\">Privacy and GDPR.<\u002Fh2>\n        <p style=\"font-size:1.0625rem; color:var(--text-soft); margin:0 0 20px;\">Most privacy policies are written to be survived, not read. Here is ours in eight lines.<\u002Fp>\n        <a href=\"#\" style=\"color:var(--clay-deep); text-decoration:none; font-size:1rem; font-weight:700; border-bottom:2px solid var(--clay-deep); display:inline-flex; align-items:center; min-height:44px;\">Read the trust centre<\u002Fa>\n      <\u002Fdiv>\n      <div style=\"display:grid; grid-template-columns:repeat(auto-fit, minmax(220px,1fr)); gap:12px; align-content:start;\">\n        <sc-for list=\"{{ privacyBullets }}\" as=\"b\" hint-placeholder-count=\"8\">\n          <div style=\"background:var(--white); border-radius:var(--r-sm); padding:16px 18px; box-shadow:var(--shadow-sm); font-size:1rem; font-weight:700; display:flex; align-items:center; gap:10px;\">\n            <div style=\"width:7px; height:7px; border-radius:50%; background:var(--clay); flex-shrink:0;\"><\u002Fdiv>\n            {{ b.strong }}\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv><\u002Fdiv>\n\n    <!-- SCHOOLS ALREADY USING IT -->\n  <div style=\"max-width:1200px; margin:0 auto; padding:48px 32px;\">\n    <h2 style=\"font-size:clamp(1.75rem, 3.5vw, 2.5rem); margin:0 0 12px; letter-spacing:-0.01em;\">Schools already using it.<\u002Fh2>\n    <div style=\"font-family:'Fraunces',serif; font-size:1.375rem; color:var(--text-soft); margin-bottom:28px;\">Used in Västerås and Eskilstuna kommun.<\u002Fdiv>\n    <div style=\"font-family:'Fraunces',serif; font-size:clamp(1.5rem, 3vw, 2rem); color:var(--green-deep); margin-bottom:32px; max-width:760px;\">90% of students already use AI in school, with no teacher visibility. Pladdra turns that into a safety net instead of a risk.<\u002Fdiv>\n    <div style=\"display:grid; grid-template-columns:repeat(auto-fit, minmax(300px,1fr)); gap:24px; margin-bottom:20px;\">\n      <sc-for list=\"{{ storyCards }}\" as=\"story\" hint-placeholder-count=\"2\">\n        <div style=\"background:var(--white); border-radius:var(--r-lg); padding:28px; box-shadow:var(--shadow-sm); display:flex; flex-direction:column; gap:14px;\">\n          <div style=\"display:flex; gap:14px; align-items:center;\">\n            <div style=\"width:52px; height:52px; border-radius:50%; background:var(--clay-tint); flex-shrink:0;\"><\u002Fdiv>\n            <div>\n              <div style=\"font-size:1rem; font-weight:700;\">{{ story.name }}<\u002Fdiv>\n              <div style=\"font-size:0.875rem; color:var(--text-muted);\">{{ story.role }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-size:1.0625rem; line-height:1.5; color:var(--text);\">“{{ story.quote }}”<\u002Fdiv>\n          <sc-if value=\"{{ story.link }}\" hint-placeholder-val=\"{{ false }}\">\n            <a href=\"#\" style=\"color:var(--clay-deep); text-decoration:none; font-size:0.875rem; font-weight:700;\">Read the story<\u002Fa>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <div style=\"font-size:0.875rem; color:var(--text-muted);\">100% EU hosting, or on-premise on your own infrastructure.<\u002Fdiv>\n  <\u002Fdiv>\n\n    <!-- THE BIGGER ARGUMENT -->\n  <div style=\"background:var(--white);\">\n    <div style=\"max-width:1200px; margin:0 auto; padding:48px 32px; display:grid; grid-template-columns:repeat(auto-fit, minmax(300px,1fr)); gap:32px; align-items:center;\">\n      <button sc-camel-on-click=\"{{ togglePlay }}\" aria-label=\"Play video\" style=\"position:relative; aspect-ratio:16/9; background:var(--ink); border-radius:var(--r-lg); border:none; cursor:pointer; overflow:hidden; padding:0;\">\n        <div style=\"position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:var(--cream);\">\n          <sc-if value=\"{{ videoPlaying }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"font-size:1rem;\">Video would play here.<\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ notPlaying }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"width:64px; height:64px; border-radius:50%; background:var(--cream); color:var(--ink); display:flex; align-items:center; justify-content:center; font-size:1.25rem;\">►<\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fbutton>\n      <div>\n        <div style=\"font-family:'Fraunces',serif; font-size:clamp(1.375rem, 2.5vw, 1.75rem); line-height:1.35; color:var(--text); margin-bottom:16px;\">The question is not whether children will use AI. It is whether they will use it to think, or to avoid thinking.<\u002Fdiv>\n        <a href=\"#\" style=\"color:var(--clay-deep); text-decoration:none; font-size:1rem; font-weight:700; border-bottom:2px solid var(--clay-deep); display:inline-flex; align-items:center; min-height:44px;\">Read the full piece<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n    <!-- MADE IN SWEDEN -->\n  <div style=\"background:var(--sand);\"><div style=\"max-width:800px; margin:0 auto; padding:56px 32px; text-align:center;\">\n    <div style=\"font-family:'Fraunces',serif; font-size:clamp(1.375rem, 2.5vw, 1.75rem); line-height:1.35; color:var(--clay-deep);\">“We're a small team of researchers, parents, and life-long learners. We don't claim more than we know or can show.”<\u002Fdiv>\n    <div style=\"font-size:0.875rem; font-weight:700; letter-spacing:0.06em; text-transform:uppercase; color:var(--text-muted); margin-top:20px;\">Made in Sweden by parents and teachers, for parents, teachers and kids<\u002Fdiv>\n  <\u002Fdiv><\u002Fdiv>\n\n    <!-- GET STARTED: FOUR DOORS -->\n  <div id=\"get-started\" style=\"max-width:1200px; margin:0 auto; padding:48px 32px 64px;\">\n    <h2 style=\"font-size:clamp(1.75rem, 3.5vw, 2.5rem); margin:0 0 32px; letter-spacing:-0.01em;\">Start here.<\u002Fh2>\n    <div style=\"display:grid; grid-template-columns:repeat(auto-fit, minmax(240px,1fr)); gap:16px;\">\n      <div style=\"grid-column:span 2; background:var(--green-deep); color:var(--cream); border-radius:var(--r-lg); padding:32px; display:flex; flex-direction:column; gap:14px;\">\n        <div style=\"font-family:'Fraunces',serif; font-size:1.375rem;\">Families<\u002Fdiv>\n        <div style=\"font-size:1rem; color:var(--green-pale);\">Free, forever. Ten minutes to set up.<\u002Fdiv>\n        <a href=\"#\" style=\"align-self:flex-start; background:var(--clay); color:var(--ink); text-decoration:none; font-size:1rem; font-weight:700; padding:14px 24px; min-height:44px; display:inline-flex; align-items:center; border-radius:var(--r-pill); margin-top:auto;\">Set up your child<\u002Fa>\n      <\u002Fdiv>\n      <sc-for list=\"{{ doorCards }}\" as=\"door\" hint-placeholder-count=\"3\">\n        <div style=\"background:var(--white); border-radius:var(--r-lg); padding:28px; box-shadow:var(--shadow-sm); display:flex; flex-direction:column; gap:12px;\">\n          <div style=\"font-family:'Fraunces',serif; font-size:1.25rem;\">{{ door.title }}<\u002Fdiv>\n          <div style=\"font-size:1rem; color:var(--text-soft);\">{{ door.line }}<\u002Fdiv>\n          <a href=\"{{ door.href }}\" style=\"align-self:flex-start; color:var(--text); text-decoration:none; font-size:1rem; font-weight:700; border-bottom:2px solid var(--ink); min-height:44px; display:inline-flex; align-items:center; margin-top:auto;\">{{ door.action }}<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n    <!-- FAQ -->\n  <div style=\"background:var(--sand);\"><div id=\"faq\" style=\"max-width:800px; margin:0 auto; padding:48px 32px 64px;\">\n    <h2 style=\"font-size:clamp(1.75rem, 3.5vw, 2.5rem); margin:0 0 32px; letter-spacing:-0.01em; text-align:center;\">FAQ.<\u002Fh2>\n    <div style=\"display:flex; flex-direction:column; gap:10px;\">\n      <sc-for list=\"{{ faqs }}\" as=\"item\" hint-placeholder-count=\"7\">\n        <div style=\"background:var(--white); border-radius:var(--r-sm); overflow:hidden; box-shadow:var(--shadow-sm);\">\n          <button sc-camel-on-click=\"{{ item.toggle }}\" aria-expanded=\"{{ item.open }}\" style=\"width:100%; text-align:left; background:none; border:none; padding:18px 20px; display:flex; align-items:center; justify-content:space-between; cursor:pointer; gap:20px; min-height:44px; font-family:inherit;\">\n            <div style=\"font-size:1.0625rem; font-weight:700; color:var(--text);\">{{ item.q }}<\u002Fdiv>\n            <div style=\"{{ item.iconStyle }}\">\n              <svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 16 16\" fill=\"none\"><path d=\"M8 1V15M1 8H15\" stroke=\"var(--green-deep)\" stroke-width=\"2\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg>\n            <\u002Fdiv>\n          <\u002Fbutton>\n          <sc-if value=\"{{ item.open }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"padding:0 20px 20px; font-size:1rem; line-height:1.55; color:var(--text-soft);\">{{ item.a }}<\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv><\u002Fdiv>\n\n  <!-- FOOTER -->\n  <footer style=\"background:var(--ink); color:#B8B5AB;\">\n    <div style=\"max-width:1200px; margin:0 auto; padding:56px 32px 32px;\">\n      <div style=\"display:grid; grid-template-columns:repeat(auto-fit, minmax(180px,1fr)); gap:32px; margin-bottom:40px;\">\n        <div>\n          <div style=\"font-family:'Fraunces',serif; font-size:1.375rem; color:var(--cream); margin-bottom:12px;\"><span style=\"color:var(--green);\">p<\u002Fspan>laddra<\u002Fdiv>\n          <div style=\"font-size:0.875rem; line-height:1.5;\">AI built for school. Made with care in Sweden.<\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <div style=\"font-size:0.875rem; font-weight:700; letter-spacing:0.05em; text-transform:uppercase; color:var(--cream); margin-bottom:14px;\">Product<\u002Fdiv>\n          <div style=\"display:flex; flex-direction:column; gap:10px; font-size:0.875rem;\">\n            <a href=\"#how\" style=\"color:#B8B5AB; text-decoration:none;\">How it works<\u002Fa>\n            <a href=\"#\" style=\"color:#B8B5AB; text-decoration:none;\">For teachers<\u002Fa>\n            <a href=\"#for-schools\" style=\"color:#B8B5AB; text-decoration:none;\">For schools<\u002Fa>\n            <a href=\"#get-started\" style=\"color:#B8B5AB; text-decoration:none;\">Pricing<\u002Fa>\n            <a href=\"#\" style=\"color:#B8B5AB; text-decoration:none;\">Changelog<\u002Fa>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <div style=\"font-size:0.875rem; font-weight:700; letter-spacing:0.05em; text-transform:uppercase; color:var(--cream); margin-bottom:14px;\">Trust<\u002Fdiv>\n          <div style=\"display:flex; flex-direction:column; gap:10px; font-size:0.875rem;\">\n            <a href=\"#privacy\" style=\"color:#B8B5AB; text-decoration:none;\">Privacy<\u002Fa>\n            <a href=\"#kidsafe\" style=\"color:#B8B5AB; text-decoration:none;\">Security<\u002Fa>\n            <a href=\"#\" style=\"color:#B8B5AB; text-decoration:none;\">Trust centre<\u002Fa>\n            <a href=\"#\" style=\"color:#B8B5AB; text-decoration:none;\">Sub-processors<\u002Fa>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <div style=\"font-size:0.875rem; font-weight:700; letter-spacing:0.05em; text-transform:uppercase; color:var(--cream); margin-bottom:14px;\">Company<\u002Fdiv>\n          <div style=\"display:flex; flex-direction:column; gap:10px; font-size:0.875rem;\">\n            <a href=\"#\" style=\"color:#B8B5AB; text-decoration:none;\">About<\u002Fa>\n            <a href=\"#\" style=\"color:#B8B5AB; text-decoration:none;\">Careers<\u002Fa>\n            <a href=\"#\" style=\"color:#B8B5AB; text-decoration:none;\">Contact<\u002Fa>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border-top:1px solid var(--line-dark); padding-top:20px; display:flex; justify-content:space-between; gap:16px; flex-wrap:wrap; font-size:0.875rem; color:#8A8778; margin-bottom:20px;\">\n        <div>Pladdra AB, Sweden. Company registration 559535-9232.<\u002Fdiv>\n        <div>One short email a month, for teachers. Nothing else.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border-top:1px solid var(--line-dark); padding-top:20px; display:flex; justify-content:space-between; gap:16px; flex-wrap:wrap; align-items:center; font-size:0.875rem;\">\n        <div style=\"display:flex; gap:14px;\">\n          <a href=\"#\" style=\"color:var(--cream); text-decoration:none; font-weight:700;\">SV<\u002Fa>\n          <a href=\"#\" style=\"color:#B8B5AB; text-decoration:none; font-weight:700;\">EN<\u002Fa>\n        <\u002Fdiv>\n        <button sc-camel-on-click=\"{{ toggleLargerText }}\" aria-pressed=\"{{ largerText }}\" style=\"background:none; border:1px solid #59564A; color:var(--cream); padding:10px 16px; min-height:44px; border-radius:var(--r-pill); cursor:pointer; font-size:0.875rem; font-family:inherit;\">Larger text<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Ffooter>\n\n<\u002Fmain>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = { openFaq: 0, navScrolled: false, mobileNavOpen: false, activeTab: 'home', largerText: false, videoPlaying: false };\n\n  componentDidMount() {\n    this.onScroll = () => {\n      const s = window.scrollY > 20;\n      if (s !== this.state.navScrolled) this.setState({ navScrolled: s });\n    };\n    window.addEventListener('scroll', this.onScroll);\n    try {\n      const saved = localStorage.getItem('pladdra-larger-text') === '1';\n      if (saved) {\n        document.documentElement.style.fontSize = '112%';\n        this.setState({ largerText: true });\n      }\n    } catch (e) {}\n  }\n\n  componentWillUnmount() {\n    window.removeEventListener('scroll', this.onScroll);\n  }\n\n  toggleFaq(i) { this.setState(s => ({ openFaq: s.openFaq === i ? -1 : i })); }\n  toggleMobileNav() { this.setState(s => ({ mobileNavOpen: !s.mobileNavOpen })); }\n  setTab(id) { this.setState({ activeTab: id }); }\n  togglePlay() { this.setState(s => ({ videoPlaying: !s.videoPlaying })); }\n\n  toggleLargerText() {\n    const next = !this.state.largerText;\n    document.documentElement.style.fontSize = next ? '112%' : '100%';\n    try { localStorage.setItem('pladdra-larger-text', next ? '1' : '0'); } catch (e) {}\n    this.setState({ largerText: next });\n  }\n\n  onTabKeyDown(e) {\n    const order = ['home', 'school', 'child'];\n    const i = order.indexOf(this.state.activeTab);\n    if (e.key === 'ArrowRight') this.setTab(order[(i + 1) % order.length]);\n    if (e.key === 'ArrowLeft') this.setTab(order[(i - 1 + order.length) % order.length]);\n  }\n\n  renderVals() {\n    const faqData = [\n      { q: \"Is it free for families?\", a: \"Yes, the home version is completely free. Schools and municipalities subscribe to the school version, and that subscription funds the free one for families.\" },\n      { q: \"What can I see as a parent?\", a: \"You get a parent view showing what your child has worked on and where they're stuck. It's enough to help them, not enough to read every word they write.\" },\n      { q: \"Does Pladdra do the homework for them?\", a: \"No. Pladdra asks what your child has already tried, then helps them get further with questions and hints. If they ask for the answer outright, it asks them what they've tried first.\" },\n      { q: \"Where is our data stored?\", a: \"All student data is stored and processed on servers inside the European Union. Details on regions and sub-processors are published in our trust centre.\" },\n      { q: \"Do you train AI models on student data?\", a: \"No. Not our models, and not anyone else's. That's written into our contracts, not just stated here, so it holds up regardless of which model providers we use.\" },\n      { q: \"Can teachers see everything?\", a: \"Yes, every conversation is visible to the assigned teacher. Students are told this in plain language the first time they log in, so nothing is hidden from them.\" },\n      { q: \"What does it cost?\", a: \"Nothing for families, and we intend to keep it that way. Schools and municipalities subscribe, priced per school or per municipality. Ask us for a quote.\" },\n    ];\n\n    const tabDefs = [\n      { id: 'home', label: 'At home' },\n      { id: 'school', label: 'At school' },\n      { id: 'child', label: 'For your child' },\n    ].map((t, i) => {\n      const selected = this.state.activeTab === t.id;\n      return {\n        label: t.label,\n        selected,\n        tabIndex: selected ? 0 : -1,\n        select: () => this.setTab(t.id),\n        style: `padding:12px 22px; min-height:44px; border-radius:100px; border:none; cursor:pointer; font-size:1rem; font-weight:700; font-family:inherit; background:${selected ? '#1C1C1C' : '#FFFFFF'}; color:${selected ? '#FAF8F4' : '#1C1C1C'};`,\n      };\n    });\n\n    return {\n      navStyle: {\n        position: 'sticky', top: 0, zIndex: 50,\n        background: this.state.navScrolled ? 'rgba(250,248,244,0.9)' : 'rgba(250,248,244,0)',\n        backdropFilter: this.state.navScrolled ? 'blur(12px)' : 'none',\n        borderBottom: this.state.navScrolled ? '1px solid #EBEBEB' : '1px solid rgba(0,0,0,0)',\n        transition: 'all 0.3s ease',\n      },\n      mobileNavOpen: this.state.mobileNavOpen,\n      toggleMobileNav: () => this.toggleMobileNav(),\n      largerText: this.state.largerText,\n      toggleLargerText: () => this.toggleLargerText(),\n      videoPlaying: this.state.videoPlaying,\n      notPlaying: !this.state.videoPlaying,\n      togglePlay: () => this.togglePlay(),\n      onTabKeyDown: (e) => this.onTabKeyDown(e),\n      tabDefs,\n      isHomeTab: this.state.activeTab === 'home',\n      isSchoolTab: this.state.activeTab === 'school',\n      isChildTab: this.state.activeTab === 'child',\n      trustItems: [\n        \"Free for families, funded by schools\",\n        \"Data stays in the EU\",\n        \"No training on student data\",\n        \"Teachers see every conversation\",\n        \"Not locked to one AI company\",\n        \"No ads, ever\",\n      ],\n      whatCardsSmall: [\n        { tag: \"For students\", title: \"Asks before it answers\", body: \"Own language, own pace. Not quick answers, help to think further.\" },\n        { tag: \"For teachers\", title: \"Insight, not just output\", body: \"See patterns in the class, not just individual answers.\" },\n        { tag: \"For schools\", title: \"Compliance without a black box\", body: \"EU hosting, signed data agreement, full control.\" },\n        { tag: \"For parents\", title: \"See where they're stuck\", body: \"Enough to help them. Not a feed of every word they write.\" },\n      ],\n      homeSteps: [\n        { n: \"01\", title: \"Set up your child\", body: \"Ten minutes. No card required.\" },\n        { n: \"02\", title: \"They learn, you understand\", body: \"See what they're working on and where they're stuck.\" },\n        { n: \"03\", title: \"Help when it matters\", body: \"Step in only where you're needed.\" },\n      ],\n      schoolSteps: [\n        { n: \"01\", title: \"Connect your class\", body: \"Sign in and add students from your roster.\" },\n        { n: \"02\", title: \"Set the ground rules\", body: \"Subject, year group, language.\" },\n        { n: \"03\", title: \"Teach\", body: \"Pladdra flags what needs you.\" },\n      ],\n      homeBullets: [\n        { strong: \"Won't do the work for them.\" },\n        { strong: \"You can see what's happening.\" },\n        { strong: \"No ads, feeds or streaks.\" },\n        { strong: \"Works with what school sets.\" },\n        { strong: \"Free for families.\" },\n        { strong: \"One family, many children.\" },\n      ],\n      teacherBullets: [\n        { strong: \"Ten-minute setup.\" },\n        { strong: \"Your curriculum, or the national one.\" },\n        { strong: \"One class view.\" },\n        { strong: \"You stay in charge.\" },\n        { strong: \"Works in your language.\" },\n        { strong: \"Support from former teachers.\" },\n      ],\n      childBullets: [\n        { strong: \"Age-appropriate by default.\" },\n        { strong: \"No open internet.\" },\n        { strong: \"Not a friend. A mentor.\" },\n        { strong: \"If something serious comes up, a named adult is told.\" },\n        { strong: \"Every conversation visible to the teacher.\" },\n        { strong: \"No profiling, ads or nudges.\" },\n      ],\n      kidSafeBulletsFull: [\n        { strong: \"Age-appropriate by default.\" },\n        { strong: \"No open internet.\" },\n        { strong: \"Not a friend. A mentor.\" },\n        { strong: \"If something serious comes up, a named adult is told. Not a bot, not a queue.\" },\n        { strong: \"Every conversation visible to the teacher.\" },\n        { strong: \"No profiling, ads or nudges.\" },\n        { strong: \"Never gives the answer outright. Asks what they've tried first.\" },\n      ],\n      privacyBullets: [\n        { strong: \"Hosted in the EU.\" },\n        { strong: \"Signed Article 28 agreement.\" },\n        { strong: \"No training on student data.\" },\n        { strong: \"We collect the minimum.\" },\n        { strong: \"Delete means delete.\" },\n        { strong: \"Export anytime, free.\" },\n        { strong: \"DPIA template provided.\" },\n        { strong: \"Sub-processors listed publicly.\" },\n      ],\n      transcript: [\n        { who: \"Child\", text: \"Just give me the answer to this one.\", note: null },\n        { who: \"Pladdra\", text: \"What have you tried so far?\", note: \"Never hands over the answer\" },\n        { who: \"Child\", text: \"I multiplied the speed by the time, I think.\", note: null },\n        { who: \"Pladdra\", text: \"That's the right idea. What units is your answer in, and does that match what the question is asking for?\", note: \"Asks what they tried first\" },\n        { who: \"Child\", text: \"Oh. It's asking for hours, not minutes.\", note: null },\n        { who: \"Pladdra\", text: \"Exactly. Try the conversion, then tell me why that step matters.\", note: \"Makes them explain it back\" },\n      ].map(t => {\n        const isChild = t.who === 'Child';\n        return {\n          who: t.who,\n          text: t.text,\n          note: t.note,\n          labelColor: isChild ? '#5F5F5F' : '#2F5A4A',\n          rowStyle: `display:flex; flex-direction:column; align-items:${isChild ? 'flex-end' : 'flex-start'};`,\n          bubbleStyle: `max-width:560px; background:${isChild ? '#FFFFFF' : '#DCEEE7'}; border-radius:16px; padding:14px 18px; box-shadow:0 2px 16px -6px rgba(28,27,24,0.08);`,\n        };\n      }),\n      storyCards: [\n        { name: \"Henrik Ljungqvist\", role: \"Head of Upper Secondary, Västerås Municipality\", quote: \"We must offer both equitable and safe education in schools as required by law and our societal mission. AI is part of that now.\", link: false },\n        { name: \"Johan Karlsson\", role: \"ICT pedagogue, Eskilstuna Municipality\", quote: \"It becomes a lever for learning. Self-directed students go further and those who need more support can get it in multiple ways.\", link: false },\n      ],\n      doorCards: [\n        { title: \"Schools and kommuner\", line: \"Talk to us about your whole school.\", action: \"Book a conversation\", href: \"#for-schools\" },\n        { title: \"See a real conversation\", line: \"Watch how Pladdra handles a stuck student.\", action: \"Watch it work\", href: \"#\" },\n        { title: \"Read the trust centre\", line: \"Where the data lives, who touches it, how to delete it.\", action: \"Open the trust centre\", href: \"#\" },\n      ],\n      faqs: faqData.map((f, i) => {\n        const open = this.state.openFaq === i;\n        return {\n          q: f.q, a: f.a, open,\n          iconStyle: { transform: open ? 'rotate(45deg)' : 'rotate(0deg)', transition: 'transform 0.25s ease', display: 'flex' },\n          toggle: () => this.toggleFaq(i),\n        };\n      }),\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
