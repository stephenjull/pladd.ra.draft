document.addEventListener('DOMContentLoaded', async function() {

  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));

    // events at the element — warn only; real JS errors carry message/error.

        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {

      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);

    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

        (e.origin === 'null' &&

            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }

    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

14px;\">\n        <sc-for list=\"{{ homeBullets }}\" as=\"b\" hint-placeholder-count=\"6\">\n          <div style=\"background:#FFFFFF; border-radius:20px; padding:22px; box-shadow:0 2px 16px -6px rgba(28,27,24,0.08); font-size:15px; font-weight:700; line-height:1.4;\">{{ b.strong }}<\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- TEACHER READY -->\n  <div style=\"background:#FAF8F4; color:#1C1C1C;\">\n    <div data-reveal-id=\"teacher\" style=\"max-width:1200px; margin:0 auto; padding:110px 32px; {{ revealStyles.teacher }}\">\n      <h2 style=\"font-family:'Fraunces',serif; font-size:46px; font-weight:500; margin:0 0 12px; letter-spacing:-0.01em; color:#1C1C1C;\">For teachers.<\u002Fh2>\n      <div style=\"font-size:16px; color:#7A7A7A; margin-bottom:56px;\">Every <span style=\"color:#5A9B84;\">p<\u002Fspan>iece fits together.<\u002Fdiv>\n      <div style=\"display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; max-width:640px;\">\n        <sc-for list=\"{{ teacherBullets }}\" as=\"b\" hint-placeholder-count=\"6\">\n          <div style=\"{{ b.pieceStyle }}\">\n            <div style=\"position:relative; width:100%; padding-top:100%;\">\n              <svg sc-camel-view-box=\"0 0 100 100\" style=\"position:absolute; inset:0; width:100%; height:100%; overflow:visible;\">\n                <path d=\"{{ b.piecePath }}\" fill=\"{{ b.pieceFill }}\" style=\"transition:fill 0.3s ease;\"><\u002Fpath>\n              <\u002Fsvg>\n              <div style=\"position:absolute; inset:0; display:flex; align-items:center; justify-content:center; padding:22%; text-align:center;\">\n                <div style=\"font-size:13px; font-weight:700; color:#1C1C1C; line-height:1.3;\">{{ b.strong }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- KID SAFE -->\n  <div id=\"kidsafe\" style=\"background:#F3EDE3;\">\n    <div data-reveal-id=\"kidsafe\" style=\"max-width:1200px; margin:0 auto; padding:110px 32px; {{ revealStyles.kidsafe }}\">\n      <h2 style=\"font-family:'Fraunces',serif; font-size:46px; font-weight:500; margin:0 0 48px; letter-spacing:-0.01em;\">Kid safe.<\u002Fh2>\n      <div style=\"display:grid; grid-template-columns:repeat(auto-fit, minmax(280px, 1fr)); gap:16px;\">\n        <sc-for list=\"{{ kidSafeBullets }}\" as=\"b\" hint-placeholder-count=\"6\">\n          <div style=\"background:#FAF8F4; border-radius:22px; padding:26px; display:flex; align-items:center; gap:16px; transition:transform 0.3s ease;\" style-hover=\"transform:translateY(-4px);\">\n            <svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 20 20\" fill=\"none\" style=\"flex-shrink:0;\"><circle cx=\"10\" cy=\"10\" r=\"9\" stroke=\"#5A9B84\" stroke-width=\"1.4\"><\u002Fcircle><path d=\"M6 10.2l2.6 2.6L14 7.4\" stroke=\"#5A9B84\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n            <div style=\"font-size:15px; font-weight:700;\">{{ b.strong }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- PRIVACY & GDPR -->\n  <div id=\"privacy\" data-reveal-id=\"privacy\" style=\"max-width:1200px; margin:0 auto; padding:110px 32px; {{ revealStyles.privacy }}\">\n    <div style=\"display:grid; grid-template-columns:0.7fr 1.3fr; gap:56px; align-items:start;\">\n      <div>\n        <h2 style=\"font-family:'Fraunces',serif; font-size:46px; font-weight:500; margin:0 0 24px; letter-spacing:-0.01em;\"><span style=\"color:#5A9B84;\">p<\u002Fspan>rivacy and GDPR.<\u002Fh2>\n        <a href=\"#\" style=\"color:#D97757; text-decoration:none; font-size:15px; font-weight:700; border-bottom:2px solid #D97757; padding-bottom:2px;\">Read the trust centre<\u002Fa>\n      <\u002Fdiv>\n      <div style=\"display:grid; grid-template-columns:repeat(2, 1fr); gap:14px;\">\n        <sc-for list=\"{{ privacyBullets }}\" as=\"b\" hint-placeholder-count=\"8\">\n          <div style=\"background:#FFFFFF; border-radius:18px; padding:20px 22px; box-shadow:0 2px 16px -6px rgba(28,27,24,0.06); font-size:14.5px; font-weight:700; display:flex; align-items:center; gap:12px;\">\n            <div style=\"width:7px; height:7px; border-radius:50%; background:#D97B62; flex-shrink:0;\"><\u002Fdiv>\n            {{ b.strong }}\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- MADE IN SWEDEN -->\n  <div style=\"max-width:800px; margin:0 auto; padding:120px 32px; text-align:center;\">\n    <h2 style=\"font-family:'Fraunces',serif; font-size:38px; font-weight:500; line-height:1.35; margin:0; letter-spacing:-0.01em; color:#D97757;\">\"We're a small team of researchers, <span style=\"color:#5A9B84;\">p<\u002Fspan>arents, and life-long learners. We don't claim more than we know or can show.\"<\u002Fh2>\n    <div style=\"font-size:14px; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; color:#7A7A7A; margin-top:24px;\">Made in Sweden by <span style=\"color:#5A9B84;\">p<\u002Fspan>arents and teachers, for <span style=\"color:#5A9B84;\">p<\u002Fspan>arents, teachers and kids<\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- GET STARTED -->\n  <div id=\"get-started\" data-reveal-id=\"cta\" style=\"max-width:1200px; margin:0 auto; padding:0 32px 120px; {{ revealStyles.cta }}\">\n    <div style=\"background:linear-gradient(120deg,#5A9B84,#3F6F5D); border-radius:36px; padding:90px 40px; text-align:center; position:relative; overflow:hidden;\">\n      <div style=\"position:absolute; top:-100px; right:-60px; width:300px; height:300px; background:radial-gradient(circle, rgba(217,164,65,0.35) 0%, rgba(217,164,65,0) 70%); border-radius:50%;\"><\u002Fdiv>\n      <h2 style=\"font-family:'Fraunces',serif; font-size:44px; font-weight:500; margin:0 0 32px; letter-spacing:-0.01em; color:#FAF8F4; position:relative;\">Free for families.<br>Subscri<span style=\"color:#5A9B84;\">p<\u002Fspan>tions for schools.<\u002Fh2>\n      <div style=\"display:flex; align-items:center; justify-content:center; gap:20px; flex-wrap:wrap; margin-bottom:18px; position:relative;\">\n        <a href=\"#\" style=\"background:#D97B62; color:#1C1C1C; text-decoration:none; font-size:16px; font-weight:700; padding:17px 34px; border-radius:100px;\" style-hover=\"background:#E59A82;\">Get <span style=\"color:#5A9B84;\">p<\u002Fspan>laddra<\u002Fa>\n        <a id=\"for-schools\" href=\"#\" style=\"color:#FAF8F4; text-decoration:none; font-size:16px; font-weight:700; border-bottom:2px solid rgba(250,248,244,0.5); padding-bottom:2px;\">Are you a school? Talk to us<\u002Fa>\n      <\u002Fdiv>\n      <div style=\"font-size:13px; color:#BFE0D3; position:relative;\">No card for families. School <span style=\"color:#5A9B84;\">p<\u002Fspan>ricing on request.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- FAQ -->\n  <div id=\"faq\" data-reveal-id=\"faq\" style=\"max-width:800px; margin:0 auto; padding:20px 32px 120px; {{ revealStyles.faq }}\">\n    <h2 style=\"font-family:'Fraunces',serif; font-size:46px; font-weight:500; margin:0 0 40px; letter-spacing:-0.01em; text-align:center;\">FAQs.<\u002Fh2>\n    <div style=\"display:flex; flex-direction:column; gap:10px;\">\n      <sc-for list=\"{{ faqs }}\" as=\"item\" hint-placeholder-count=\"7\">\n        <div style=\"background:#FFFFFF; border-radius:18px; overflow:hidden; box-shadow:0 2px 14px -8px rgba(28,27,24,0.08);\">\n          <div sc-camel-on-click=\"{{ item.toggle }}\" style=\"padding:20px 24px; display:flex; align-items:center; justify-content:space-between; cursor:pointer; gap:20px;\">\n            <div style=\"font-size:16px; font-weight:700;\">{{ item.q }}<\u002Fdiv>\n            <div style=\"{{ item.iconStyle }}\">\n              <svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 16 16\" fill=\"none\"><path d=\"M8 1V15M1 8H15\" stroke=\"#5A9B84\" stroke-width=\"2\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <sc-if value=\"{{ item.open }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"padding:0 24px 22px; font-size:15px; line-height:1.6; color:#4A4A4A;\">{{ item.a }}<\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- FOOTER -->\n  <div style=\"background:#1C1C1C; color:#B8B5AB;\">\n    <div style=\"max-width:1200px; margin:0 auto; padding:70px 32px 40px;\">\n      <div style=\"display:grid; grid-template-columns:1.4fr 1fr 1fr 1fr; gap:40px; margin-bottom:56px;\">\n        <div>\n          <div style=\"font-family:'Fraunces',serif; font-size:22px; font-weight:300; color:#FAF8F4; margin-bottom:14px;\"><span style=\"color:#5A9B84;\">p<\u002Fspan>laddra<\u002Fdiv>\n          <div style=\"font-size:14px; line-height:1.6;\">AI built for school. Made with care in Sweden.<\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <div style=\"font-size:13px; font-weight:700; letter-spacing:0.06em; text-transform:uppercase; color:#FAF8F4; margin-bottom:16px;\"><span style=\"color:#5A9B84;\">p<\u002Fspan>roduct<\u002Fdiv>\n          <div style=\"display:flex; flex-direction:column; gap:11px; font-size:14px;\">\n            <a href=\"#how\" style=\"color:#B8B5AB; text-decoration:none;\">How it works<\u002Fa>\n            <a href=\"#\" style=\"color:#B8B5AB; text-decoration:none;\">For teachers<\u002Fa>\n            <a href=\"#for-schools\" style=\"color:#B8B5AB; text-decoration:none;\">For schools<\u002Fa>\n            <a href=\"#get-started\" style=\"color:#B8B5AB; text-decoration:none;\"><span style=\"color:#5A9B84;\">p<\u002Fspan>ricing<\u002Fa>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <div style=\"font-size:13px; font-weight:700; letter-spacing:0.06em; text-transform:uppercase; color:#FAF8F4; margin-bottom:16px;\">Trust<\u002Fdiv>\n          <div style=\"display:flex; flex-direction:column; gap:11px; font-size:14px;\">\n            <a href=\"#privacy\" style=\"color:#B8B5AB; text-decoration:none;\"><span style=\"color:#5A9B84;\">p<\u002Fspan>rivacy<\u002Fa>\n            <a href=\"#kidsafe\" style=\"color:#B8B5AB; text-decoration:none;\">Security<\u002Fa>\n            <a href=\"#\" style=\"color:#B8B5AB; text-decoration:none;\">Trust centre<\u002Fa>\n            <a href=\"#\" style=\"color:#B8B5AB; text-decoration:none;\">Sub-<span style=\"color:#5A9B84;\">p<\u002Fspan>rocessors<\u002Fa>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <div style=\"font-size:13px; font-weight:700; letter-spacing:0.06em; text-transform:uppercase; color:#FAF8F4; margin-bottom:16px;\">Com<span style=\"color:#5A9B84;\">p<\u002Fspan>any<\u002Fdiv>\n          <div style=\"display:flex; flex-direction:column; gap:11px; font-size:14px;\">\n            <a href=\"#\" style=\"color:#B8B5AB; text-decoration:none;\">About<\u002Fa>\n            <a href=\"#\" style=\"color:#B8B5AB; text-decoration:none;\">Careers<\u002Fa>\n            <a href=\"#\" style=\"color:#B8B5AB; text-decoration:none;\">Contact<\u002Fa>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border-top:1px solid #39372F; padding-top:28px; display:flex; justify-content:space-between; gap:20px; flex-wrap:wrap; font-size:13px; color:#7A7A7A;\">\n        <div><span style=\"color:#5A9B84;\">p<\u002Fspan>laddra AB, Sweden. Com<span style=\"color:#5A9B84;\">p<\u002Fspan>any registration 559535-9232.<\u002Fdiv>\n        <div>One short email a month, for teachers. Nothing else.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = { openFaq: 0, navScrolled: false, revealed: {} };\n  revealIds = ['cards','how','home','kidsafe','privacy','teacher','cta','faq'];\n  els = {};\n\n  componentDidMount() {\n    this.onScroll = () => {\n      const s = window.scrollY > 20;\n      if (s !== this.state.navScrolled) this.setState({ navScrolled: s });\n    };\n    window.addEventListener('scroll', this.onScroll);\n    this.observer = new IntersectionObserver((entries) => {\n      entries.forEach((e) => {\n        if (e.isIntersecting) {\n          const id = e.target.getAttribute('data-reveal-id');\n          this.setState(s => ({ revealed: { ...s.revealed, [id]: true } }));\n          this.observer.unobserve(e.target);\n        }\n      });\n    }, { threshold: 0.12 });\n    this.revealIds.forEach(id => {\n      const el = document.querySelector('[data-reveal-id=\"' + id + '\"]');\n      if (el) this.observer.observe(el);\n    });\n  }\n\n  componentWillUnmount() {\n    window.removeEventListener('scroll', this.onScroll);\n    if (this.observer) this.observer.disconnect();\n  }\n\n  toggleFaq(i) {\n    this.setState(s => ({ openFaq: s.openFaq === i ? -1 : i }));\n  }\n\n  renderVals() {\n    const faqData = [\n      { q: \"Is it free for families?\", a: \"Yes, the home version is completely free. Schools and municipalities subscribe to the school version, and that subscription funds the free one for families.\" },\n      { q: \"What can I see as a parent?\", a: \"You get a parent view showing what your child has worked on and where they're stuck. It's enough to help them — not a surveillance feed of every word they write.\" },\n      { q: \"Does Pladdra do the homework for them?\", a: \"No. Pladdra asks what your child has already tried, then helps them get further with questions and hints. If they ask for the answer outright, it asks them what they've tried first.\" },\n      { q: \"Where is our data stored?\", a: \"All student data is stored and processed on servers inside the European Union. Details on regions and sub-processors are published in our trust centre.\" },\n      { q: \"Do you train AI models on student data?\", a: \"No — not our models, and not anyone else's. That's written into our contracts, not just stated here, so it holds up regardless of which model providers we use.\" },\n      { q: \"Can teachers see everything?\", a: \"Yes, every conversation is visible to the assigned teacher. Students are told this in plain language the first time they log in, so nothing is hidden from them.\" },\n      { q: \"What does it cost?\", a: \"Nothing for families, and we intend to keep it that way. Schools and municipalities subscribe, priced per school or per municipality — ask us for a quote.\" },\n    ];\n\n    const reveal = (id) => {\n      const r = this.state.revealed[id];\n      return {\n        opacity: r ? 1 : 0,\n        transform: r ? 'translateY(0)' : 'translateY(28px)',\n        transition: 'opacity 0.7s ease, transform 0.7s ease',\n      };\n    };\n    const revealStyles = {};\n    this.revealIds.forEach(id => { revealStyles[id] = reveal(id); });\n\n    const tIn = this.state.revealed.teacher;\n    // square jigsaw piece path: unit 0-100 square with tabs/blanks on edges\n    // tabs: 1 = knob out, -1 = blank in, 0 = flat edge\n    const jigsawPath = (top, right, bottom, left) => {\n      const t = 20, r = 100 - 20;\n      const bump = (dir) => dir * 14;\n      let d = `M0,0 `;\n      // top edge\n      if (top === 0) d += `L100,0 `;\n      else d += `L40,0 C40,${bump(-top)} 30,${bump(-top)*1.4} 30,${14*top===0?0: (top>0? -14:14)} `;\n      // simpler: build with fixed control approach below instead\n      return d;\n    };\n\n    // Simpler robust jigsaw path generator using consistent bump geometry\n    function piecePath(top, right, bottom, left) {\n      const s = 100; // size\n      const b = 16; // bump depth\n      const w = 26; // bump neck width position (from 37 to 63)\n      const seg = (dir, axis) => {\n        // returns path fragment for a bump pointing outward(1) or inward(-1) or flat(0)\n      };\n      let d = `M0 0 `;\n      // TOP edge (left to right)\n      if (top === 0) {\n        d += `H100 `;\n      } else {\n        const y = top > 0 ? -b : b;\n        d += `H37 C37 ${y} 63 ${y} 63 0 H100 `;\n      }\n      // RIGHT edge (top to bottom)\n      if (right === 0) {\n        d += `V100 `;\n      } else {\n        const x = right > 0 ? 100 + b : 100 - b;\n        d += `V37 C${x} 37 ${x} 63 100 63 V100 `;\n      }\n      // BOTTOM edge (right to left)\n      if (bottom === 0) {\n        d += `H0 `;\n      } else {\n        const y = bottom > 0 ? 100 + b : 100 - b;\n        d += `H63 C63 ${y} 37 ${y} 37 100 H0 `;\n      }\n      // LEFT edge (bottom to top)\n      if (left === 0) {\n        d += `V0 Z`;\n      } else {\n        const x = left > 0 ? -b : b;\n        d += `V63 C${x} 63 ${x} 37 0 37 V0 Z`;\n      }\n      return d;\n    }\n\n    // 3x2 grid of pieces, tabs interlock between neighbors (top row / bottom row)\n    // grid positions: 0 1 2\n    //                 3 4 5\n    const pieceDefs = [\n      { top: 0,  right: 1,  bottom: -1, left: 0  },\n      { top: 0,  right: 1,  bottom: 1,  left: -1 },\n      { top: 0,  right: 0,  bottom: -1, left: -1 },\n      { top: 1,  right: 1,  bottom: 0,  left: 0  },\n      { top: -1, right: -1, bottom: 0,  left: -1 },\n      { top: 1,  right: 0,  bottom: 0,  left: 1  },\n    ];\n    const pieceFills = ['#F3E1D6', '#EAC8B5', '#F3E1D6', '#EAC8B5', '#F3E1D6', '#EAC8B5'];\n    const converge = (dx, dy, delay) => {\n      const transform = tIn ? 'translate(0,0)' : `translate(${dx}px, ${dy}px)`;\n      return `opacity:${tIn ? 1 : 0}; transform:${transform}; transition:transform 0.8s cubic-bezier(.2,.8,.2,1) ${delay}s, opacity 0.5s ease ${delay}s;`;\n    };\n    const convergeDeltas = [[-50,-50],[0,-60],[50,-50],[-50,50],[0,60],[50,50]];\n\n    return {\n      navStyle: {\n        position: 'sticky', top: 0, zIndex: 50,\n        background: this.state.navScrolled ? 'rgba(250,248,244,0.85)' : 'rgba(250,248,244,0)',\n        backdropFilter: this.state.navScrolled ? 'blur(12px)' : 'none',\n        borderBottom: this.state.navScrolled ? '1px solid #EBEBEB' : '1px solid rgba(0,0,0,0)',\n        transition: 'all 0.3s ease',\n      },\n      revealStyles,\n      trustItems: [\n        \"Data stays in the EU\",\n        \"GDPR by design\",\n        \"Teachers see every conversation\",\n        \"No advertising, ever\",\n        \"No training on student data\",\n      ],\n      whatCardsSmall: [\n        { tag: \"For students\", title: \"Asks before it answers\", body: \"Own language, own pace.\" },\n        { tag: \"For teachers\", title: \"Class insight\", body: \"Who's stuck, what to teach next.\" },\n        { tag: \"For schools\", title: \"Compliance\", body: \"EU hosting, signed data agreement.\" },\n        { tag: \"For Parents\", title: \"Confidence and security\", body: \"In the future of learning and work.\" },\n      ],\n      homeSteps: [\n        { n: \"01\", title: \"Set up your child\", body: \"Ten minutes. No card required.\" },\n        { n: \"02\", title: \"They learn, you understand\", body: \"See what they're working on and where they're stuck.\" },\n        { n: \"03\", title: \"Help when it matters\", body: \"Step in only where you're needed.\" },\n      ],\n      schoolSteps: [\n        { n: \"01\", title: \"Connect your class\", body: \"Sign in and add students from your roster.\" },\n        { n: \"02\", title: \"Set the ground rules\", body: \"Subject, year group, language.\" },\n        { n: \"03\", title: \"Teach\", body: \"Pladdra flags what needs you.\" },\n      ],\n      homeBullets: [\n        { strong: \"Won't do the work for them.\" },\n        { strong: \"You can see what's happening.\" },\n        { strong: \"No ads, feeds or streaks.\" },\n        { strong: \"Not a friend. A mentor.\" },\n        { strong: \"Free for families.\" },\n        { strong: \"One family, many children.\" },\n      ],\n      kidSafeBullets: [\n        { strong: \"Age-appropriate by default.\" },\n        { strong: \"No open internet.\" },\n        { strong: \"Not a friend. A mentor.\" },\n        { strong: \"Crisis goes to a named adult.\" },\n        { strong: \"Every conversation visible to the teacher.\" },\n        { strong: \"No profiling, ads or nudges.\" },\n      ],\n      privacyBullets: [\n        { strong: \"Hosted in the EU.\" },\n        { strong: \"Signed Article 28 agreement.\" },\n        { strong: \"No training on student data.\" },\n        { strong: \"We collect the minimum.\" },\n        { strong: \"Delete means delete.\" },\n        { strong: \"Export anytime, free.\" },\n        { strong: \"DPIA template provided.\" },\n        { strong: \"Sub-processors listed publicly.\" },\n      ],\n      teacherBullets: [\n        { strong: \"Ten-minute setup.\" },\n        { strong: \"Your curriculum, or the national one.\" },\n        { strong: \"One class view.\" },\n        { strong: \"You stay in charge.\" },\n        { strong: \"Works in your language.\" },\n        { strong: \"Support from former teachers.\" },\n      ].map((item, i) => ({\n        ...item,\n        piecePath: piecePath(pieceDefs[i].top, pieceDefs[i].right, pieceDefs[i].bottom, pieceDefs[i].left),\n        pieceFill: pieceFills[i],\n        pieceStyle: converge(convergeDeltas[i][0], convergeDeltas[i][1], i * 0.06),\n      })),\n      faqs: faqData.map((f, i) => {\n        const open = this.state.openFaq === i;\n        return {\n          q: f.q,\n          a: f.a,\n          open,\n          iconStyle: { transform: open ? 'rotate(45deg)' : 'rotate(0deg)', transition: 'transform 0.25s ease', display: 'flex' },\n          toggle: () => this.toggleFaq(i),\n        };\n      }),\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
